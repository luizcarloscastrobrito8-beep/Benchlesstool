name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build BenchlessTools.csproj -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: BenchlessTools
          path: bin/Release/netstandard2.1/BenchlessTools.dll
